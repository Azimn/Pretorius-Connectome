name: Archive original real FlyWire Pilot14 synaptic stability evidence

on:
  workflow_run:
    workflows: ['FlyWire Pilot14 usage-protected synaptic stability and linear null']
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  original-seven-model-archival:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.repository == 'Azimn/Pretorius-Connectome' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_RUN_ID: "${{ github.event.workflow_run.id }}"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download original full real-v783 seven-model source-linked case evidence
        uses: actions/download-artifact@v4
        with:
          run-id: "${{ github.event.workflow_run.id }}"
          name: pilot14-REAL-original-FlyWire-v783-seven-arm-evidence
          path: captured
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Fail closed on original biological source, all seven weights and external oracle-only case evidence
        run: |
          set -euo pipefail
          FILE="$(find captured -name pilot14-REAL-v783-stability.json -type f | head -n 1)"
          test -n "$FILE" && test -f "$FILE"
          WEIGHTS="$(find captured -name original_baseline.npz -type f | head -n 1)"
          test -n "$WEIGHTS" && test -f "$WEIGHTS"
          DIR="$(dirname "$WEIGHTS")"
          test -f "$DIR/original_beta1.npz"
          test -f "$DIR/original_beta4.npz"
          test -f "$DIR/rewired_beta1.npz"
          test -f "$DIR/matched_slot_linear.npz"
          python scripts/archive_flywire_pilot14.py \
            --input "$FILE" --weights "$DIR" --run-id "$SOURCE_RUN_ID"
      - name: Commit exact source cases, original weights, human-readable results, and handoff
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/imprinting/checkpoints/ results/imprinting/runs/ \
            results/imprinting/PILOT14_REAL_SYNAPTIC_STABILITY_RESULTS.md \
            results/imprinting/README.md docs/RESEARCH_HANDOFF.md
          if git diff --cached --quiet; then
            echo "Exact complete real source and learned weights already archived"
            exit 0
          fi
          git commit -m "Archive real original FlyWire Pilot14 seven-arm run $SOURCE_RUN_ID"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
