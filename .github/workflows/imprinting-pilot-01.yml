name: Imprinting pilot 01

on:
  pull_request:
    paths:
      - 'src/pretorius_connectome/imprinting.py'
      - 'scripts/run_imprinting_pilot.py'
      - 'tests/test_imprinting_pilot.py'
      - 'docs/IMPRINTING_PILOT_01.md'
      - 'memories/current/Pretorius_v12_450_Events_Complete.jsonl'
      - 'memories/annotations/v12_450_sidecars.jsonl'
      - '.github/workflows/imprinting-pilot-01.yml'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  imprinting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Verify v12 archive checkpoint
        run: python scripts/validate_autobiographical_corpus_v12.py
      - name: Test imprinting module
        run: python -m unittest discover -s tests -p 'test_imprinting_pilot.py' -v
      - name: Run reproducible 450-memory pilot
        run: python scripts/run_imprinting_pilot.py --seeds 0,1,2 --loads 50,100,200,450 --output results/imprinting/pilot01.json > /dev/null
      - name: Preserve experimental result JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot01-imprinting-results
          path: results/imprinting/pilot01.json
          if-no-files-found: warn
