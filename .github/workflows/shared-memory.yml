name: Pretorius shared memory v1
on:
  push:
    paths:
      - "src/pretorius_connectome/shared_memory.py"
      - "src/pretorius_connectome/associative.py"
      - "scripts/build_shared_memory.py"
      - "tests/test_shared_memory.py"
      - ".github/workflows/shared-memory.yml"
  pull_request:
    paths:
      - "src/pretorius_connectome/shared_memory.py"
      - "src/pretorius_connectome/associative.py"
      - "scripts/build_shared_memory.py"
      - "tests/test_shared_memory.py"
      - ".github/workflows/shared-memory.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cache-and-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: CPU packages
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "scikit-learn>=1.5,<2"
      - name: Full original-source and cached-consumer tests
        run: OPENBLAS_NUM_THREADS=1 python -m unittest discover -s tests -p test_shared_memory.py -v
      - name: Build 450-record portable L1 and L2 artifact
        run: |
          OPENBLAS_NUM_THREADS=1 python scripts/build_shared_memory.py --seed 31 --output-dir data/derived/shared-memory-v1 --report results/shared-memory/seed31.json
          OPENBLAS_NUM_THREADS=1 python scripts/build_shared_memory.py --seed 37 --output-dir data/derived/shared-memory-v1-seed37 --report results/shared-memory/seed37.json
      - name: Upload reproducible v1 features, split manifests and performance report
        uses: actions/upload-artifact@v4
        with:
          name: pretorius-shared-memory-v1
          path: |
            data/derived/shared-memory-v1/
            data/derived/shared-memory-v1-seed37/
            results/shared-memory/
          retention-days: 30
