name: Imprinting pilot 06

on:
  pull_request:
    paths:
      - 'src/pretorius_connectome/pilot06.py'
      - 'scripts/run_imprinting_pilot06.py'
      - 'tests/test_imprinting_pilot06.py'
      - 'docs/IMPRINTING_PILOT_06.md'
      - 'docs/PILOT07_REVIEW_PROTOCOL.md'
      - 'results/imprinting/PILOT06_RESULTS.md'
      - 'README.md'
      - '.github/workflows/imprinting-pilot-06.yml'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pyarrow>=17,<24' 'scikit-learn>=1.5,<2' 'rank-bm25>=0.2,<1'
      - name: Validate frozen autobiographical archive
        run: python scripts/validate_autobiographical_corpus_v12.py
      - name: Run full regression and evidence tests
        run: python -m unittest discover -s tests -v
      - name: Execute Pilot 06A posthoc evidence assay
        run: python scripts/run_imprinting_pilot06.py --seeds 31,37,43 --output results/imprinting/pilot06.json > /dev/null
      - name: Preserve per-case diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot06-evidence-results
          path: results/imprinting/pilot06.json
          if-no-files-found: warn
