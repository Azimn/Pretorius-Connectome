name: FlyWire v783 full graph conversion

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pyarrow>=17,<24'
      - name: Run regression tests before large conversion
        run: python -m unittest discover -s tests -v
      - name: Acquire verified biological inputs
        run: python scripts/download_flywire_v783.py --destination data/flywire_v783
      - name: Convert biological graph to CSR
        run: |
          python scripts/convert_flywire_feather.py \
            data/flywire_v783/proofread_connections_783.feather \
            data/flywire_v783/proofread_root_ids_783.npy \
            data/derived/flywire_v783_csr.npz | tee conversion-report.json
      - name: Verify output structure and measure size
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          path = Path("data/derived/flywire_v783_csr.npz")
          with np.load(path, allow_pickle=False) as graph:
              roots = graph["root_ids"]
              indptr = graph["indptr"]
              indices = graph["indices"]
              counts = graph["synapse_counts"]
              assert len(indptr) == len(roots) + 1
              assert indptr[0] == 0 and indptr[-1] == len(indices) == len(counts)
              assert np.all(indptr[1:] >= indptr[:-1])
              assert np.all(indices >= 0) and np.all(indices < len(roots))
              assert np.all(counts > 0)
              report = {
                  "neurons": int(len(roots)),
                  "directed_pairs": int(len(indices)),
                  "synaptic_contacts": int(counts.sum()),
                  "csr_bytes": int(sum(graph[k].nbytes for k in graph.files)),
                  "artifact_bytes": path.stat().st_size,
              }
          Path("csr-verification.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flywire-v783-csr-report
          path: |
            conversion-report.json
            csr-verification.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: flywire-v783-csr-graph
          path: data/derived/flywire_v783_csr.npz
          compression-level: 0
          retention-days: 7
