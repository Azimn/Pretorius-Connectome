name: FlyWire mushroom body anatomical retrieval diagnostic

on:
  push:
    paths:
      - '.github/workflows/associative-flywire-mushroom-body.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mb-connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.5,<2' 'rank-bm25>=0.2,<1' 'pyarrow>=17,<24'
      - name: Validate source archive and region converter
        run: |
          python -m unittest discover -s tests -p 'test_feather_conversion.py' -v
          python -m unittest discover -s tests -p 'test_associative.py' -v
          python scripts/validate_autobiographical_corpus_v12.py
      - name: Download and verify primary FlyWire release
        run: python scripts/download_flywire_v783.py --destination data/flywire_v783
      - name: Extract exact neuropil-annotated mushroom body adjacency
        run: |
          python scripts/convert_flywire_feather.py \
            data/flywire_v783/proofread_connections_783.feather \
            data/flywire_v783/proofread_root_ids_783.npy \
            data/derived/flywire_v783_mb_csr.npz \
            --neuropil-prefix MB_ --prune-to-region \
            | tee results_mb_conversion.json
      - name: Three-seed mushroom body vs rewired null
        run: |
          OPENBLAS_NUM_THREADS=1 python scripts/run_associative_memory.py \
            --topology data/derived/flywire_v783_mb_csr.npz \
            --benchmark --seeds 31,37,43 \
            --output results/associative/flywire-v783-mb-three-seed.json
      - name: Preserve compact extraction report and all case records
        uses: actions/upload-artifact@v4
        with:
          name: flywire-mb-region-three-seed-posthoc
          path: |
            results_mb_conversion.json
            results/associative/flywire-v783-mb-three-seed.json
          retention-days: 90
          if-no-files-found: error
