name: Vector Fly neuron-class anchors Pilot 02

on:
  push:
    paths:
      - 'src/pretorius_connectome/cell_anchors.py'
      - 'src/pretorius_connectome/associative.py'
      - 'scripts/run_vector_fly_cell_anchors.py'
      - 'scripts/download_vector_fly_annotations.py'
      - 'tests/test_cell_anchors.py'
      - '.github/workflows/vector-fly-cell-class-anchors.yml'
  pull_request:
    paths:
      - 'src/pretorius_connectome/cell_anchors.py'
      - 'src/pretorius_connectome/associative.py'
      - 'scripts/run_vector_fly_cell_anchors.py'
      - 'scripts/download_vector_fly_annotations.py'
      - 'tests/test_cell_anchors.py'
      - '.github/workflows/vector-fly-cell-class-anchors.yml'
  workflow_dispatch:

concurrency:
  group: vector-fly-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  synthetic-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local scientific dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.5,<2' 'rank-bm25>=0.2,<1'
      - name: Verify pinned archive and class-anchor fixture control
        run: |
          python scripts/validate_autobiographical_corpus_v12.py
          python -m unittest discover -s tests -p test_associative.py -v
          python -m unittest discover -s tests -p test_cell_anchors.py -v
          python -m unittest discover -s tests -p test_flywire_plasticity.py -v

  real-neuron-class:
    runs-on: ubuntu-latest
    needs: synthetic-controls
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local scientific dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.5,<2' 'rank-bm25>=0.2,<1' 'pyarrow>=17,<24'
      - name: Acquire checksum-pinned biological connectivity
        run: python scripts/download_flywire_v783.py --destination data/flywire_v783
      - name: Convert immutable mushroom-body neuropil adjacency
        run: |
          python scripts/convert_flywire_feather.py \
            data/flywire_v783/proofread_connections_783.feather \
            data/flywire_v783/proofread_root_ids_783.npy \
            data/derived/flywire_v783_mb_csr.npz \
            --neuropil-prefix MB_ --prune-to-region
      - name: Acquire version-pinned published neuron cell classes
        run: |
          python scripts/download_vector_fly_annotations.py \
            --output data/flywire_v783/neuron_annotations_v3_2_0.tsv
      - name: Fit shared TF-IDF L2 v2 on three independent training episodes
        run: |
          for seed in 31 37 43; do
            python scripts/build_shared_memory_l2.py \
              --seed "$seed" --output-dir "data/derived/vector-fly-l2/seed$seed"
          done
      - name: Execute biological cell-class and matched-size degree-pool control
        run: |
          python scripts/run_vector_fly_cell_anchors.py \
            --topology data/derived/flywire_v783_mb_csr.npz \
            --annotations data/flywire_v783/neuron_annotations_v3_2_0.tsv \
            --cache-root data/derived/vector-fly-l2 \
            --class-field cell_class --class-match Kenyon \
            --seeds 31,37,43 \
            --output results/associative/vector-fly-cell-class-pilot02.json \
            | tee results/associative/vector-fly-cell-class-pilot02-compact.json
      - name: Require both outputs to parse independently as JSON
        run: |
          python -m json.tool results/associative/vector-fly-cell-class-pilot02.json > /dev/null
          python -m json.tool results/associative/vector-fly-cell-class-pilot02-compact.json > /dev/null
      - name: Retain original full case-level output and anatomical-class audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vector-fly-cellclass-pilot02-original
          path: |
            results/associative/vector-fly-cell-class-pilot02.json
            results/associative/vector-fly-cell-class-pilot02-compact.json
          retention-days: 90
          if-no-files-found: warn
