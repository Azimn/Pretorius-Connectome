name: Imprinting pilot 05

on:
  pull_request:
    paths:
      - 'src/pretorius_connectome/pilot05.py'
      - 'scripts/run_imprinting_pilot05.py'
      - 'tests/test_imprinting_pilot05.py'
      - 'docs/IMPRINTING_PILOT_05.md'
      - 'results/imprinting/PILOT05_RESULTS.md'
      - 'README.md'
      - '.github/workflows/imprinting-pilot-05.yml'
      - 'memories/current/Pretorius_v12_450_Events_Complete.jsonl'
      - 'memories/annotations/v12_450_sidecars.jsonl'
      - 'experiments/pilot04/challenge_v1.jsonl'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  narrative:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing and narrative dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pyarrow>=17,<24' 'scikit-learn>=1.5,<2' 'rank-bm25>=0.2,<1'
      - name: Validate unchanged autobiography
        run: python scripts/validate_autobiographical_corpus_v12.py
      - name: Run full unit and leakage suite
        run: python -m unittest discover -s tests -v
      - name: Execute Pilot 05A three-seed posthoc diagnostic
        run: python scripts/run_imprinting_pilot05.py --seeds 31,37,43 --output results/imprinting/pilot05.json > /dev/null
      - name: Preserve per-case results and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot05-narrative-results
          path: results/imprinting/pilot05.json
          if-no-files-found: warn
