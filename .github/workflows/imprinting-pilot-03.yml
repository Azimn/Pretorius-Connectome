name: Imprinting pilot 03

on:
  pull_request:
    paths:
      - 'src/pretorius_connectome/pilot03.py'
      - 'scripts/run_imprinting_pilot03.py'
      - 'tests/test_imprinting_pilot03.py'
      - 'docs/IMPRINTING_PILOT_03.md'
      - 'results/imprinting/PILOT03_RESULTS.md'
      - '.github/workflows/imprinting-pilot-03.yml'
      - 'memories/current/Pretorius_v12_450_Events_Complete.jsonl'
      - 'memories/annotations/v12_450_sidecars.jsonl'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pilot03:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Confirm unchanged v12 memory archive
        run: python scripts/validate_autobiographical_corpus_v12.py
      - name: Run all existing and Pilot 03 tests
        run: python -m unittest discover -s tests -v
      - name: Execute prespecified Pilot 03
        run: python scripts/run_imprinting_pilot03.py --seeds 31,37,43 --output results/imprinting/pilot03.json > /dev/null
      - name: Upload full seed-level metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot03-imprinting-results
          path: results/imprinting/pilot03.json
          if-no-files-found: warn
