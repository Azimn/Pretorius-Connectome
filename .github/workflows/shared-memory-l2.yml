name: Pretorius shared memory L2
on:
  push:
    paths:
      - "src/pretorius_connectome/shared_memory_l2.py"
      - "src/pretorius_connectome/associative.py"
      - "scripts/build_shared_memory_l2.py"
      - "scripts/run_associative_memory.py"
      - "tests/test_shared_memory_l2.py"
      - ".github/workflows/shared-memory-l2.yml"
  pull_request:
    paths:
      - "src/pretorius_connectome/shared_memory_l2.py"
      - "src/pretorius_connectome/associative.py"
      - "scripts/build_shared_memory_l2.py"
      - "scripts/run_associative_memory.py"
      - "tests/test_shared_memory_l2.py"
      - ".github/workflows/shared-memory-l2.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cache-and-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: CPU packages
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "scikit-learn>=1.5,<2" "rank-bm25>=0.2,<1"
      - name: Test original L1 and compatible L2 consumers
        run: |
          OPENBLAS_NUM_THREADS=1 python -m unittest discover -s tests -p test_shared_memory.py -v
          OPENBLAS_NUM_THREADS=1 python -m unittest discover -s tests -p test_shared_memory_l2.py -v
      - name: Build split-specific L2
        run: |
          OPENBLAS_NUM_THREADS=1 python scripts/build_shared_memory_l2.py --seed 31 --output-dir data/derived/shared-memory-l2-seed31 --report results/shared-memory/seed31-l2.json
          OPENBLAS_NUM_THREADS=1 python scripts/build_shared_memory_l2.py --seed 37 --output-dir data/derived/shared-memory-l2-seed37 --report results/shared-memory/seed37-l2.json
      - name: Compare existing FlyWire retrieval control with cached L2
        run: |
          OPENBLAS_NUM_THREADS=1 python scripts/run_associative_memory.py --synthetic-test --benchmark --seeds 31 --output results/shared-memory/legacy.json
          OPENBLAS_NUM_THREADS=1 python scripts/run_associative_memory.py --synthetic-test --benchmark --seeds 31 --shared-cache data/derived/shared-memory-l2-seed31 --output results/shared-memory/shared.json
          python -c 'import json; a=json.load(open("results/shared-memory/legacy.json")); b=json.load(open("results/shared-memory/shared.json")); assert a["trials"]==b["trials"]; assert b["shared_l2_encoder"] is not None'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pretorius-shared-l2-reproduction
          path: |
            data/derived/shared-memory-l2-seed31/
            data/derived/shared-memory-l2-seed37/
            results/shared-memory/
          retention-days: 30
