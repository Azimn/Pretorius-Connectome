name: Archive real original FlyWire Pilot10 multicue evidence

on:
  workflow_run:
    workflows: ['FlyWire direct imprint Pilot 10 multicue binding']
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  archive-verified-complete-main-biological-run:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.repository == 'Azimn/Pretorius-Connectome' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_RUN_ID: "${{ github.event.workflow_run.id }}"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve only real original v783 biological direct10 cases
        uses: actions/download-artifact@v4
        with:
          run-id: "${{ github.event.workflow_run.id }}"
          name: direct10-REAL-original-full-v783-cases-and-overlay
          path: captured
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Check original source hashes, all original per-case results and conditions
        run: |
          set -euo pipefail
          FILE="$(find captured -name direct10-real-v783.json -type f | head -n 1)"
          test -n "$FILE" && test -f "$FILE"
          WEIGHTS="$(find captured -name direct10-real-multicue.npz -type f | head -n 1)"
          test -n "$WEIGHTS" && test -f "$WEIGHTS"
          python scripts/archive_direct_flywire_imprint10.py \
            --input "$FILE" --run-id "$SOURCE_RUN_ID" --checkpoint "$WEIGHTS"
      - name: Commit permanent case evidence, summary, index and handoff to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/imprinting/checkpoints/ results/imprinting/runs/ results/imprinting/PILOT10_REAL_MULTICUE_RESULTS.md \
            results/imprinting/README.md docs/RESEARCH_HANDOFF.md
          if git diff --cached --quiet; then
            echo "Already archived: original evidence identical"
            exit 0
          fi
          git commit -m "Archive original real whole-FlyWire Pilot10 multiple-cue run $SOURCE_RUN_ID"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
