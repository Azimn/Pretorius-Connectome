name: FlyWire train-only plasticity Pilot 01

on:
  push:
    paths:
      - 'src/pretorius_connectome/plasticity.py'
      - 'scripts/run_flywire_plasticity_pilot01.py'
      - 'scripts/verify_flywire_plasticity_cache_parity.py'
      - 'tests/test_flywire_plasticity.py'
      - '.github/workflows/flywire-plasticity-pilot-01.yml'
      - 'docs/FLYWIRE_PLASTICITY_PILOT_01.md'
  pull_request:
    paths:
      - 'src/pretorius_connectome/plasticity.py'
      - 'scripts/run_flywire_plasticity_pilot01.py'
      - 'scripts/verify_flywire_plasticity_cache_parity.py'
      - 'scripts/archive_flywire_plasticity.py'
      - 'tests/test_flywire_plasticity.py'
      - '.github/workflows/flywire-plasticity-pilot-01.yml'
      - 'docs/FLYWIRE_PLASTICITY_PILOT_01.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local research dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.5,<2' 'rank-bm25>=0.2,<1'
      - name: Verify frozen autobiography and overlay unit tests
        run: |
          python scripts/validate_autobiographical_corpus_v12.py
          python -m unittest discover -s tests -p test_associative.py -v
          python -m unittest discover -s tests -p test_flywire_plasticity.py -v
      - name: Build deterministic v2 TF-IDF in independent Python hash processes
        run: |
          PYTHONHASHSEED=13 python scripts/build_shared_memory_l2.py --seed 31 --output-dir data/derived/plasticity-l2-a/seed31
          PYTHONHASHSEED=941 python scripts/build_shared_memory_l2.py --seed 31 --output-dir data/derived/plasticity-l2-b/seed31
      - name: Require exact independently rebuilt v2 cache and learned topology reproducibility
        run: |
          PYTHONHASHSEED=13 python scripts/run_flywire_plasticity_pilot01.py --synthetic-test --seeds 31 --shared-cache-root data/derived/plasticity-l2-a --output results/associative/plasticity-synthetic-v2-a.json
          PYTHONHASHSEED=941 python scripts/run_flywire_plasticity_pilot01.py --synthetic-test --seeds 31 --shared-cache-root data/derived/plasticity-l2-b --output results/associative/plasticity-synthetic-v2-b.json
          python scripts/verify_flywire_plasticity_cache_parity.py results/associative/plasticity-synthetic-v2-a.json results/associative/plasticity-synthetic-v2-b.json
      - name: Preserve the old uncached feature selector as a separate historical diagnostic
        run: |
          python scripts/run_flywire_plasticity_pilot01.py --synthetic-test --seeds 31 --output results/associative/plasticity-synthetic-historical-uncached.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plasticity-pilot01-synthetic-diagnostic
          path: results/associative/plasticity-synthetic-*.json
          if-no-files-found: warn

  real-mushroom-body:
    runs-on: ubuntu-latest
    needs: synthetic-integrity
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local research dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.5,<2' 'rank-bm25>=0.2,<1' 'pyarrow>=17,<24'
      - name: Download and checksum-verify official FlyWire v783 data
        run: python scripts/download_flywire_v783.py --destination data/flywire_v783
      - name: Extract original neuropil-selected connectivity without mutation
        run: |
          python scripts/convert_flywire_feather.py \
            data/flywire_v783/proofread_connections_783.feather \
            data/flywire_v783/proofread_root_ids_783.npy \
            data/derived/flywire_v783_mb_csr.npz \
            --neuropil-prefix MB_ --prune-to-region \
            | tee results_mb_conversion.json
      - name: Build training-only shared TF-IDF representations for three fixed seeds
        run: |
          for seed in 31 37 43; do
            python scripts/build_shared_memory_l2.py --seed "$seed" --output-dir "data/derived/plasticity-l2/seed$seed"
          done
      - name: Train and compare real-vs-rewired plasticity and frozen graph
        run: |
          python scripts/run_flywire_plasticity_pilot01.py \
            --topology data/derived/flywire_v783_mb_csr.npz \
            --shared-cache-root data/derived/plasticity-l2 \
            --seeds 31,37,43 --gain 2.0 --trace-activity-cap 256 \
            --output results/associative/flywire-mb-plasticity-pilot01-full.json \
            | tee results/associative/flywire-mb-plasticity-pilot01-compact.json
      - name: Assert complete and compact results are independently valid JSON
        run: |
          python -m json.tool results/associative/flywire-mb-plasticity-pilot01-full.json > /dev/null
          python -m json.tool results/associative/flywire-mb-plasticity-pilot01-compact.json > /dev/null
      - name: Preserve every original case-level prediction and verification trace
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flywire-mb-plasticity-pilot01-raw
          path: |
            results_mb_conversion.json
            results/associative/flywire-mb-plasticity-pilot01-full.json
            results/associative/flywire-mb-plasticity-pilot01-compact.json
          if-no-files-found: warn
          retention-days: 90
