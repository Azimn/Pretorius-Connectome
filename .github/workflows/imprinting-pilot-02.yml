name: Imprinting pilot 02

on:
  pull_request:
    paths:
      - 'src/pretorius_connectome/pilot02.py'
      - 'scripts/run_imprinting_pilot02.py'
      - 'tests/test_imprinting_pilot02.py'
      - 'docs/IMPRINTING_PILOT_02.md'
      - 'memories/current/Pretorius_v12_450_Events_Complete.jsonl'
      - 'memories/annotations/v12_450_sidecars.jsonl'
      - '.github/workflows/imprinting-pilot-02.yml'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pilot02:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Validate frozen v12 source
        run: python scripts/validate_autobiographical_corpus_v12.py
      - name: Test Pilot 02 and leakage guards
        run: python -m unittest discover -s tests -p 'test_imprinting_pilot02.py' -v
      - name: Run Pilot 02, three seeds, 450 event archive
        run: python scripts/run_imprinting_pilot02.py --seeds 0,1,2 --output results/imprinting/pilot02.json > /dev/null
      - name: Upload reproducible result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot02-imprinting-results
          path: results/imprinting/pilot02.json
          if-no-files-found: warn
